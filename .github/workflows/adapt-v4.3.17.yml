name: Adapt Coolify v4.3.17

on:
  push:
    branches: ['compat/coolify-v4.3.17']

permissions:
  contents: write

jobs:
  adapt:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat/coolify-v4.3.17
          fetch-depth: 0

      - name: Pin community pack to exact stable release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('community-pack/build.sh'), Path('community-pack/install.sh'), Path('README.md'), Path('community-pack/README.md')]
          replacements = {
              'v4.3.15': 'v4.3.17',
              '4.3.15': '4.3.17',
              'b8866b87e8e855e041c21330352ca615521afed3': '5ff21103974a30e107ce046190fb478658a214e7',
          }
          for p in files:
              s = p.read_text()
              for a, b in replacements.items(): s = s.replace(a, b)
              p.write_text(s)
          PY
          grep -q "UPSTREAM_TAG='v4.3.17'" community-pack/build.sh
          grep -q "UPSTREAM_SHA='5ff21103974a30e107ce046190fb478658a214e7'" community-pack/build.sh
          grep -q "EXPECTED_VERSION='4.3.17'" community-pack/install.sh
          grep -q "EXPECTED_SHA='5ff21103974a30e107ce046190fb478658a214e7'" community-pack/install.sh

      - name: Commit exact-release adaptation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add community-pack/build.sh community-pack/install.sh README.md community-pack/README.md
          git commit -m 'fix: adapt community pack to Coolify v4.3.17'
          git push origin HEAD:compat/coolify-v4.3.17
