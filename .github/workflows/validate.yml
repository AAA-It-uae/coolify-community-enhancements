name: Validate

on:
  push:
    branches: [main, 'compat/**']
  pull_request:

permissions:
  contents: read

env:
  COOLIFY_TAG: v4.3.17
  COOLIFY_SHA: 5ff21103974a30e107ce046190fb478658a214e7

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n dashboard-observability/install.sh
          bash -n dashboard-performance/install.sh
          bash -n community-pack/build.sh
          bash -n community-pack/install.sh

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP syntax
        run: |
          php -l dashboard-observability/files/LocalProjectStatus.php
          php -l dashboard-observability/files/LocalServerVitals.php

      - name: Build pack against exact Coolify 4.3.17 source
        run: |
          bash community-pack/build.sh "$RUNNER_TEMP/coolify-v4.3.17"
          test "$(git -C "$RUNNER_TEMP/coolify-v4.3.17" rev-parse HEAD)" = "$COOLIFY_SHA"
          test "$(git -C "$RUNNER_TEMP/coolify-v4.3.17" diff --cached --name-only | wc -l)" -eq 12
          git -C "$RUNNER_TEMP/coolify-v4.3.17" diff --cached --check

      - name: Validate required public assets
        run: |
          test -f assets/screenshots/server-vitals-cpu-ram-disk.png
          test -f assets/screenshots/project-running-domain.webp
          test -f assets/screenshots/project-stopped-status.webp
          test -f assets/screenshots/running-first-sort.webp
          test -f assets/screenshots/interactive-magnifier.png
          test -f interactive-magnifier/files/local-magnifier.blade.php

  dev-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build patched exact-source worktree
        run: |
          bash community-pack/build.sh "$RUNNER_TEMP/coolify-v4.3.17"
          test "$(git -C "$RUNNER_TEMP/coolify-v4.3.17" rev-parse HEAD)" = "$COOLIFY_SHA"

      - name: Prepare official development environment
        working-directory: ${{ runner.temp }}/coolify-v4.3.17
        run: |
          cp .env.development.example .env
          APP_KEY_VALUE="base64:$(openssl rand -base64 32)"
          cat >> .env <<EOF
          APP_KEY=$APP_KEY_VALUE
          DB_HOST=postgres
          DB_PORT=5432
          DEV_BIND_ADDRESS=127.0.0.1
          APP_PORT=18000
          FORWARD_DB_PORT=15432
          FORWARD_REDIS_PORT=16379
          FORWARD_SOKETI_PORT=16001
          FORWARD_MAILPIT_PORT=11025
          FORWARD_MAILPIT_DASHBOARD_PORT=18025
          FORWARD_MINIO_PORT=19000
          FORWARD_MINIO_PORT_CONSOLE=19001
          EOF
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Start isolated official Coolify development stack
        working-directory: ${{ runner.temp }}/coolify-v4.3.17
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build postgres redis soketi coolify
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18000/api/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.yml -f docker-compose.dev.yml ps
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color --tail=200 coolify postgres redis soketi
          exit 1

      - name: Validate patched features inside dev container
        working-directory: ${{ runner.temp }}/coolify-v4.3.17
        run: |
          test "$(docker inspect -f '{{.State.Status}}' coolify)" = running
          test "$(docker inspect -f '{{.State.Health.Status}}' coolify-db)" = healthy
          test "$(docker inspect -f '{{.State.Health.Status}}' coolify-redis)" = healthy
          test "$(docker inspect -f '{{.State.Health.Status}}' coolify-realtime)" = healthy
          grep -q '<livewire:local-server-vitals' resources/views/layouts/app.blade.php
          grep -q '<x-local-magnifier' resources/views/layouts/app.blade.php
          grep -q 'wire:poll.60000ms' resources/views/livewire/deployments-indicator.blade.php
          curl -fsS http://127.0.0.1:18000/api/health

      - name: Development stack logs on failure
        if: failure()
        working-directory: ${{ runner.temp }}/coolify-v4.3.17
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color --tail=300 || true

      - name: Tear down isolated development stack
        if: always()
        working-directory: ${{ runner.temp }}/coolify-v4.3.17
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v --remove-orphans || true
