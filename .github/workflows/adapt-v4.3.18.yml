name: Adapt Coolify v4.3.18

on:
  push:
    branches: ['compat/coolify-v4.3.18']

permissions:
  contents: write

jobs:
  adapt:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat/coolify-v4.3.18
          fetch-depth: 0

      - name: Pin community pack and CI to exact stable release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('community-pack/build.sh'),
              Path('community-pack/install.sh'),
              Path('README.md'),
              Path('community-pack/README.md'),
              Path('.github/workflows/validate.yml'),
          ]
          replacements = {
              'v4.3.17': 'v4.3.18',
              '4.3.17': '4.3.18',
              '5ff21103974a30e107ce046190fb478658a214e7': 'abc701ac6503afc602661fcfc52e0c455f289e73',
          }
          for p in files:
              s = p.read_text()
              for a, b in replacements.items():
                  s = s.replace(a, b)
              p.write_text(s)
          PY
          grep -q "UPSTREAM_TAG='v4.3.18'" community-pack/build.sh
          grep -q "UPSTREAM_SHA='abc701ac6503afc602661fcfc52e0c455f289e73'" community-pack/build.sh
          grep -q "EXPECTED_VERSION='4.3.18'" community-pack/install.sh
          grep -q "EXPECTED_SHA='abc701ac6503afc602661fcfc52e0c455f289e73'" community-pack/install.sh
          grep -q 'COOLIFY_TAG: v4.3.18' .github/workflows/validate.yml
          grep -q 'COOLIFY_SHA: abc701ac6503afc602661fcfc52e0c455f289e73' .github/workflows/validate.yml

      - name: Commit exact-release adaptation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add community-pack/build.sh community-pack/install.sh README.md community-pack/README.md .github/workflows/validate.yml
          git commit -m 'fix: adapt community pack to Coolify v4.3.18'
          git push origin HEAD:compat/coolify-v4.3.18
