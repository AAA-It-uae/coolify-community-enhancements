name: Preserve live vitals v4.3.21

on:
  push:
    branches: ['compat/coolify-v4.3.21-live-vitals']

permissions:
  contents: write

jobs:
  adapt:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat/coolify-v4.3.21-live-vitals
          fetch-depth: 0
      - name: Keep five-second visible vitals behavior in pack validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              Path('community-pack/build.sh'): [('wire:poll.15s="refreshVitals"', 'wire:poll.5s.visible="refreshVitals"')],
              Path('community-pack/install.sh'): [('wire:poll.15s="refreshVitals"', 'wire:poll.5s.visible="refreshVitals"')],
              Path('README.md'): [('15-second host-vitals refresh', '5-second visible host-vitals refresh')],
          }
          for p, pairs in replacements.items():
              s = p.read_text()
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f'missing anchor in {p}: {old}')
                  s = s.replace(old, new)
              p.write_text(s)
          PY
          grep -q 'wire:poll.5s.visible="refreshVitals"' community-pack/build.sh
          grep -q 'wire:poll.5s.visible="refreshVitals"' community-pack/install.sh
      - name: Commit preserved live-vitals behavior
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add community-pack/build.sh community-pack/install.sh README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: preserve five-second visible server vitals'
          git push origin HEAD:compat/coolify-v4.3.21-live-vitals
