<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Coolify Community Enhancements</title>
  <desc id="desc">Animated hero showing live vitals, project status, running-first sorting, magnifier and performance enhancements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11131d"/>
      <stop offset="0.55" stop-color="#0b0d14"/>
      <stop offset="1" stop-color="#07090e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#8b5cf6" stop-opacity=".09"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>

  <g opacity=".12" stroke="#d8dbe6" stroke-width="1">
    <path d="M0 90H1200M0 180H1200M0 270H1200"/>
    <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360"/>
  </g>

  <circle cx="180" cy="100" r="220" fill="url(#glow)" filter="url(#softGlow)">
    <animate attributeName="cx" values="180;1020;180" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;125;90" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".18">
    <path d="M-180 360L40 0" stroke="#a78bfa" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;1380 0" dur="5.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="600" y="105" text-anchor="middle" fill="#f7f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="-.8">Coolify Community Enhancements</text>
  <text x="600" y="148" text-anchor="middle" fill="#b7bdcd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Tested UI/UX, observability and performance improvements for self-hosted Coolify</text>

  <rect x="470" y="171" width="260" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="x" values="470;430;470" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="width" values="260;340;260" dur="3.6s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" filter="url(#shadow)">
    <g transform="translate(34 207)">
      <animateTransform attributeName="transform" type="translate" values="34 207;34 201;34 207" dur="3.4s" repeatCount="indefinite"/>
      <rect width="190" height="62" rx="16" fill="#151824" stroke="#3b4052"/>
      <circle cx="20" cy="21" r="5" fill="#10b981"/>
      <text x="34" y="27" fill="#eff1f7">LIVE VITALS</text>
      <text x="34" y="49" fill="#8f96a8" font-size="13" font-weight="400">CPU · RAM · Load</text>
    </g>
    <g transform="translate(258 207)">
      <animateTransform attributeName="transform" type="translate" values="258 207;258 203;258 207" dur="3.8s" repeatCount="indefinite"/>
      <rect width="218" height="62" rx="16" fill="#151824" stroke="#3b4052"/>
      <circle cx="20" cy="21" r="5" fill="#22c55e"/>
      <text x="34" y="27" fill="#eff1f7">PROJECT STATUS</text>
      <text x="34" y="49" fill="#8f96a8" font-size="13" font-weight="400">Running · Stopped · Health</text>
    </g>
    <g transform="translate(510 207)">
      <animateTransform attributeName="transform" type="translate" values="510 207;510 200;510 207" dur="4.1s" repeatCount="indefinite"/>
      <rect width="190" height="62" rx="16" fill="#151824" stroke="#3b4052"/>
      <circle cx="20" cy="21" r="5" fill="#f59e0b"/>
      <text x="34" y="27" fill="#eff1f7">RUNNING FIRST</text>
      <text x="34" y="49" fill="#8f96a8" font-size="13" font-weight="400">Operational priority</text>
    </g>
    <g transform="translate(734 207)">
      <animateTransform attributeName="transform" type="translate" values="734 207;734 202;734 207" dur="3.6s" repeatCount="indefinite"/>
      <rect width="175" height="62" rx="16" fill="#151824" stroke="#3b4052"/>
      <circle cx="20" cy="21" r="5" fill="#8b5cf6"/>
      <text x="34" y="27" fill="#eff1f7">MAGNIFIER</text>
      <text x="34" y="49" fill="#8f96a8" font-size="13" font-weight="400">Fast UI inspection</text>
    </g>
    <g transform="translate(943 207)">
      <animateTransform attributeName="transform" type="translate" values="943 207;943 199;943 207" dur="4.3s" repeatCount="indefinite"/>
      <rect width="223" height="62" rx="16" fill="#151824" stroke="#3b4052"/>
      <circle cx="20" cy="21" r="5" fill="#3b82f6"/>
      <text x="34" y="27" fill="#eff1f7">PERFORMANCE</text>
      <text x="34" y="49" fill="#8f96a8" font-size="13" font-weight="400">Less repeated work</text>
    </g>
  </g>

  <g fill="#8b5cf6" opacity=".8">
    <circle cx="90" cy="304" r="2"><animate attributeName="cy" values="304;297;304" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="302" r="2"><animate attributeName="cy" values="302;308;302" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="505" cy="305" r="2"><animate attributeName="cy" values="305;299;305" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="301" r="2"><animate attributeName="cy" values="301;307;301" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="915" cy="304" r="2"><animate attributeName="cy" values="304;298;304" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="301" r="2"><animate attributeName="cy" values="301;306;301" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="329" text-anchor="middle" fill="#7f879a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Open source · Safe installers · Backup / validation / rollback</text>
</svg>